- name: Parse CDP links
  hosts: "{{ target_hosts }}"
  gather_facts: no

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_network_cli_ssh_type: paramiko
    ansible_user: "{{ SSHA }}"
    ansible_password: "{{ SSHP }}"
    ansible_become: false
    ansible_ssh_common_args: "{{ SSH_KEX }}"

  tasks:
    - name: Hent CDP neighbors detail
      cisco.ios.ios_command:
        commands:
          - show cdp neighbors detail
      register: cdp_output

    - name: Parse CDP entries
      set_fact:
        cdp_matches: >-
          {{
            cdp_output.stdout[0]
            | regex_findall('Device ID: (.+?)\\n[\\s\\S]*?Interface: (.+?),\\s+Port ID \\(outgoing port\\): (.+?)\\n')
          }}

    - name: Byg CDP links
      set_fact:
        cdp_links: "{{ cdp_links | default([]) + [ {
          'local_device': inventory_hostname,
          'local_interface': item.1,
          'remote_device_raw': item.0,
          'remote_device': item.0.split('.')[0],
          'remote_interface': item.2
        } ] }}"
      loop: "{{ cdp_matches }}"
      when:
        - item.0.split('.')[0] is match('^ISP-')

    - name: Vis parsed links
      debug:
        var: cdp_links
